# Keeps the dependencies current: Dependabot opens the pull requests and the
# checks workflow (lint, tests and build) says whether they are safe to merge.
version: 2

updates:
    - package-ecosystem: "npm"
      directory: "/"
      assignees:
          - "moilolon"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      # package.json holds exact versions (no ^ or ~): every update rewrites it, not only the lockfile
      versioning-strategy: "increase"
      commit-message:
          prefix: "chore"
          include: "scope"
      groups:
          # One pull request for all the minor and patch updates of the week
          minor-and-patch:
              update-types:
                  - "minor"
                  - "patch"
      # A major update comes alone, in its own pull request: it may need changes in the code
      ignore:
          # Follows the Node version of the project (package.json engines), changed by hand with it
          - dependency-name: "@types/node"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "github-actions"
      directory: "/"
      assignees:
          - "moilolon"
      schedule:
          interval: "monthly"
      commit-message:
          prefix: "chore"
          include: "scope"
