name: checks

# What a pull request must pass (Dependabot's too): lint, tests and build. The job is "checks",
# the status the main ruleset requires. Two caches, both saved from main and shared with every
# branch: npm's downloads (setup-node) and Next.js's build cache (.next/cache).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Node of package.json's engines
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The build is the type check, and it writes the pages of each language and the CV. The
      # service clients are created when their module loads, so they need a value to exist;
      # nothing is called during the build.
      - run: npm run build
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SECRET_KEY: ci-placeholder
          RESEND_API_KEY: ci-placeholder
