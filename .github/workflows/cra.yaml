name: "Code Review Assistant"

on:
    push:
        branches-ignore:
            - "main"

jobs:
    run-lint:
        name: Lint, test and build
        runs-on: "ubuntu-latest"
        steps:
            - name: "Checkout"
              uses: "actions/checkout@v7"

            - name: "Setup NodeJS"
              uses: "actions/setup-node@v7"
              with:
                  node-version: "25.x"

            - name: "Cache Dependencies"
              uses: "actions/cache/restore@v6"
              id: "cache"
              env:
                  cache-name: "cache-node-modules"
              with:
                  path: "**/node_modules"
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

            - if: steps.cache.outputs.cache-hit != 'true'
              name: Install Dependencies
              run: "npm ci"

            - name: Run Lint
              run: "npm run lint"

            - name: Run Tests
              run: "npm test"

            # The build is the type check, and it writes the pages of each language and the CV.
            # The service clients are created when their module loads, so they need a value
            # to exist; nothing is called during the build.
            - name: Run Build
              run: "npm run build"
              env:
                  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "ci-placeholder"
                  SUPABASE_URL: "https://ci-placeholder.supabase.co"
                  SUPABASE_SECRET_KEY: "ci-placeholder"
                  RESEND_API_KEY: "ci-placeholder"
